<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel – BEZENT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .toggle-checkbox:checked { transform: translateX(100%); border-color: #7c3aed; }
        .toggle-checkbox:checked + .toggle-label { background-color: #7c3aed; }
        .toggle-checkbox:disabled + .toggle-label { opacity: 0.4; cursor: not-allowed; }
        .user-row { animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Nav -->
    <header class="bg-purple-900 text-white shadow-lg">
        <div class="max-w-5xl mx-auto flex items-center justify-between px-6 py-4">
            <div class="flex items-center gap-8">
                <div class="flex items-center gap-3">
                    <div class="bg-purple-600 p-1.5 rounded-lg">
                        <i data-lucide="shield-check" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base leading-none">Admin Control</h1>
                        <p class="text-purple-300 text-xs mt-0.5">Normal Admin Panel</p>
                    </div>
                </div>
                <div class="hidden sm:flex gap-2" id="moduleLinks"></div>
            </div>
            <button onclick="logout()" class="flex items-center gap-1.5 text-sm text-purple-200 hover:text-white transition-colors">
                <i data-lucide="log-out" class="w-4 h-4"></i> Sign out
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-8">

        <!-- Add User -->
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 mb-6 flex flex-col sm:flex-row gap-3 items-start sm:items-center justify-between">
            <div>
                <h2 class="font-semibold text-gray-800">Add New User</h2>
                <p class="text-xs text-gray-500 mt-0.5">Enter their email to create an account and assign access.</p>
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
                <input type="email" id="newUserEmail" placeholder="user@company.com"
                    class="flex-1 sm:w-64 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                <button onclick="addUser()" id="addUserBtn"
                    class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition whitespace-nowrap flex items-center gap-1.5">
                    <i data-lucide="user-plus" class="w-4 h-4"></i> Add User
                </button>
            </div>
        </div>

        <!-- Search -->
        <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold text-gray-700 text-sm">Users <span id="userCount" class="text-gray-400 font-normal"></span></h3>
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-400"></i>
                <input type="text" id="userSearch" placeholder="Search users..."
                    class="pl-8 pr-3 py-1.5 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-purple-500 w-48">
            </div>
        </div>

        <!-- User List -->
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
            <!-- Header row -->
            <div class="grid grid-cols-[1fr_160px_120px_100px_36px] gap-3 px-5 py-3 bg-gray-50 border-b border-gray-100 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                <span>User</span>
                <span>Module</span>
                <span>Access</span>
                <span>Role</span>
                <span></span>
            </div>
            <div id="userList">
                <div class="flex items-center justify-center py-12 text-gray-400 text-sm gap-2">
                    <i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Loading users...
                </div>
            </div>
        </div>

    </main>

    <script>
        lucide.createIcons();

        /* ── Auth guard ───────────────────────────────── */
        const TK = 'bezent_jwt';
        let currentUser = null;

        try {
            const raw = localStorage.getItem('bezent_user');
            if (!raw) throw new Error();
            currentUser = JSON.parse(raw);
            if (currentUser.role !== 'admin') window.location.replace('index.html');
        } catch { window.location.replace('index.html'); }

        if (!localStorage.getItem(TK)) window.location.replace('index.html');

        /* Module shortcut links */
        document.addEventListener('DOMContentLoaded', () => {
            const el = document.getElementById('moduleLinks');
            if (el) el.innerHTML = `
                <a href="marketflow-crm.html" class="text-xs text-purple-200 hover:text-white px-3 py-1.5 rounded-lg hover:bg-purple-800 transition flex items-center gap-1.5">
                    <i data-lucide="bar-chart-2" class="w-3.5 h-3.5"></i> MarketFlow
                </a>
                <a href="projectflow-crm.html" class="text-xs text-purple-200 hover:text-white px-3 py-1.5 rounded-lg hover:bg-purple-800 transition flex items-center gap-1.5">
                    <i data-lucide="folder-kanban" class="w-3.5 h-3.5"></i> Project Flow
                </a>
                <a href="hr-admin.html" class="text-xs text-purple-200 hover:text-white px-3 py-1.5 rounded-lg hover:bg-purple-800 transition flex items-center gap-1.5">
                    <i data-lucide="users" class="w-3.5 h-3.5"></i> HR Admin
                </a>`;
            lucide.createIcons();
        });

        /* ── API helper ───────────────────────────────── */
        const apiFetch = async (path, opts = {}) => {
            const h = { 'Content-Type': 'application/json' };
            const tok = localStorage.getItem(TK);
            if (tok) h['Authorization'] = 'Bearer ' + tok;
            if (opts.headers) Object.assign(h, opts.headers);
            try {
                const res = await fetch('/api' + path, { ...opts, headers: h });
                if (res.status === 401) { localStorage.clear(); window.location.replace('index.html'); return null; }
                return await res.json();
            } catch { return { error: 'Network error' }; }
        };

        /* ── State ────────────────────────────────────── */
        let allUsers = [];

        /* ── Render ───────────────────────────────────── */
        function renderUsers(users) {
            const cnt = document.getElementById('userCount');
            if (cnt) cnt.textContent = `(${users.length})`;

            const list = document.getElementById('userList');
            if (!users.length) {
                list.innerHTML = `<div class="flex items-center justify-center py-12 text-gray-400 text-sm gap-2">
                    <i data-lucide="users" class="w-4 h-4"></i> No users found. Add one above.
                </div>`;
                lucide.createIcons();
                return;
            }

            list.innerHTML = users.map(u => {
                // Determine which module is currently active (for the dropdown default)
                const module = u.projectflow_access && !u.marketflow_access ? 'projectflow' : 'marketflow';
                const hasAccess = module === 'marketflow' ? u.marketflow_access : u.projectflow_access;

                return `
                <div class="user-row grid grid-cols-[1fr_160px_120px_100px_36px] gap-3 px-5 py-3.5 items-center border-b border-gray-50 hover:bg-gray-50/70 transition-colors last:border-0" data-id="${u.id}">
                    <!-- User -->
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-8 h-8 rounded-full bg-purple-100 text-purple-700 flex items-center justify-center font-semibold text-sm flex-shrink-0">
                            ${u.email.charAt(0).toUpperCase()}
                        </div>
                        <div class="min-w-0">
                            <div class="text-sm font-medium text-gray-800 truncate">${u.email}</div>
                        </div>
                    </div>

                    <!-- Module dropdown -->
                    <select onchange="onModuleChange('${u.id}', '${u.email}', this.value)"
                        class="text-xs border border-gray-200 rounded-lg px-2 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-purple-400 cursor-pointer text-gray-700 w-full">
                        <option value="marketflow" ${module === 'marketflow' ? 'selected' : ''}>MarketFlow</option>
                        <option value="projectflow" ${module === 'projectflow' ? 'selected' : ''}>Project Flow</option>
                        <option value="both" ${u.marketflow_access && u.projectflow_access ? 'selected' : ''}>Both</option>
                    </select>

                    <!-- Toggle -->
                    <div class="flex items-center gap-2">
                        <div class="relative inline-block w-9 align-middle select-none flex-shrink-0">
                            <input type="checkbox" id="tgl-${u.id}"
                                class="toggle-checkbox absolute block w-[18px] h-[18px] rounded-full bg-white border-4 appearance-none cursor-pointer z-10 top-0 left-0 transition-all duration-200 outline-none"
                                ${hasAccess ? 'checked' : ''}
                                onchange="onToggle('${u.id}', '${u.email}', this.checked)" />
                            <label for="tgl-${u.id}" class="toggle-label block overflow-hidden h-[18px] rounded-full bg-gray-300 cursor-pointer transition-colors duration-200"></label>
                        </div>
                        <span id="tgl-label-${u.id}" class="text-xs font-medium ${hasAccess ? 'text-purple-600' : 'text-gray-400'} w-10">
                            ${hasAccess ? 'On' : 'Off'}
                        </span>
                    </div>

                    <!-- Role badge -->
                    <div>
                        <span class="text-xs px-2 py-0.5 rounded-full font-medium capitalize
                            ${u.role === 'manager' ? 'bg-blue-50 text-blue-600' :
                              u.role === 'employee' ? 'bg-green-50 text-green-600' :
                              'bg-gray-100 text-gray-500'}">
                            ${u.role}
                        </span>
                    </div>

                    <!-- Delete -->
                    <button onclick="deleteUser('${u.email}', '${u.id}')"
                        class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-300 hover:text-red-500 hover:bg-red-50 transition-colors flex-shrink-0" title="Delete user">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        /* ── Module change: update the toggle state based on selected module ── */
        function onModuleChange(id, email, module) {
            const u = allUsers.find(x => x.id === id);
            if (!u) return;
            const checkbox = document.getElementById('tgl-' + id);
            const label = document.getElementById('tgl-label-' + id);

            // Show current access state for chosen module
            let currentAccess;
            if (module === 'both') {
                currentAccess = u.marketflow_access && u.projectflow_access;
            } else {
                currentAccess = module === 'marketflow' ? u.marketflow_access : u.projectflow_access;
            }
            checkbox.checked = currentAccess;
            label.textContent = currentAccess ? 'On' : 'Off';
            label.className = `text-xs font-medium w-10 ${currentAccess ? 'text-purple-600' : 'text-gray-400'}`;

            // Store the selected module on the row for the toggle to use
            const row = document.querySelector(`[data-id="${id}"]`);
            if (row) row.dataset.module = module;
        }

        /* ── Toggle ───────────────────────────────────── */
        async function onToggle(id, email, newState) {
            const row = document.querySelector(`[data-id="${id}"]`);
            const module = row?.dataset.module || (row?.querySelector('select')?.value) || 'marketflow';
            const label = document.getElementById('tgl-label-' + id);
            const checkbox = document.getElementById('tgl-' + id);

            checkbox.disabled = true;
            label.textContent = '...';
            label.className = 'text-xs font-medium w-10 text-gray-400 animate-pulse';

            let payload = {};
            if (module === 'both') {
                payload = { marketflow_access: newState, projectflow_access: newState };
            } else if (module === 'marketflow') {
                payload = { marketflow_access: newState };
            } else {
                payload = { projectflow_access: newState };
            }

            const res = await apiFetch('/auth/users/' + encodeURIComponent(email) + '/access', {
                method: 'PUT',
                body: JSON.stringify(payload)
            });

            checkbox.disabled = false;

            if (res && res.ok) {
                const u = allUsers.find(x => x.id === id);
                if (u) {
                    if (payload.marketflow_access !== undefined) u.marketflow_access = newState;
                    if (payload.projectflow_access !== undefined) u.projectflow_access = newState;
                }
                label.textContent = newState ? 'On' : 'Off';
                label.className = `text-xs font-medium w-10 ${newState ? 'text-purple-600' : 'text-gray-400'}`;
            } else {
                alert(res?.error || 'Failed to update access');
                checkbox.checked = !newState;
                label.textContent = !newState ? 'On' : 'Off';
                label.className = `text-xs font-medium w-10 ${!newState ? 'text-purple-600' : 'text-gray-400'}`;
            }
        }

        /* ── Delete ───────────────────────────────────── */
        async function deleteUser(email, id) {
            if (!confirm(`Delete ${email}? This cannot be undone.`)) return;
            const res = await apiFetch('/auth/users/' + encodeURIComponent(email), { method: 'DELETE' });
            if (res && res.ok) {
                allUsers = allUsers.filter(u => u.id !== id);
                renderUsers(allUsers);
            } else {
                alert(res?.error || 'Failed to delete user');
            }
        }

        /* ── Add User ─────────────────────────────────── */
        async function addUser() {
            const input = document.getElementById('newUserEmail');
            const btn = document.getElementById('addUserBtn');
            const email = input.value.trim();
            if (!email) { input.focus(); return; }

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Adding...`;
            lucide.createIcons();

            const res = await apiFetch('/auth/users', {
                method: 'POST',
                body: JSON.stringify({ email })
            });

            btn.disabled = false;
            btn.innerHTML = `<i data-lucide="user-plus" class="w-4 h-4"></i> Add User`;
            lucide.createIcons();

            if (res && res.ok) {
                allUsers.unshift({ id: res.id, email: res.email, role: res.role, marketflow_access: false, projectflow_access: false });
                renderUsers(allUsers);
                input.value = '';
            } else {
                alert(res?.error || 'Failed to add user');
            }
        }

        /* ── Search ───────────────────────────────────── */
        document.getElementById('userSearch').addEventListener('input', e => {
            const q = e.target.value.toLowerCase();
            renderUsers(allUsers.filter(u => u.email.toLowerCase().includes(q)));
        });

        /* ── Load ────────────────────────────────────── */
        async function loadUsers() {
            const res = await apiFetch('/auth/users');
            if (res && Array.isArray(res)) {
                allUsers = res;
                renderUsers(allUsers);
            } else {
                document.getElementById('userList').innerHTML = `<div class="py-10 text-center text-red-400 text-sm">Failed to load users. Please refresh.</div>`;
            }
        }

        /* ── Logout ──────────────────────────────────── */
        function logout() {
            localStorage.clear();
            window.location.replace('index.html');
        }

        loadUsers();
    </script>
</body>
</html>
