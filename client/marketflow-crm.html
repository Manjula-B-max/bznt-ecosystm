<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        /* Light Purple Theme System */
        :root {
            /* Primary Light Purple Palette */
            --purple-50: #faf5ff;
            --purple-100: #f3e8ff;
            --purple-200: #e9d5ff;
            --purple-300: #d8b4fe;
            --purple-400: #c084fc;
            --purple-500: #a855f7;
            --purple-600: #9333ea;
            --purple-700: #7c3aed;
            --purple-800: #6b21a8;
            --purple-900: #581c87;

            /* Replacing Blue with Light Purple */
            --primary-50: #faf5ff;
            --primary-100: #f3e8ff;
            --primary-200: #e9d5ff;
            --primary-300: #d8b4fe;
            --primary-400: #c084fc;
            --primary-500: #a855f7;
            --primary-600: #9333ea;
            --primary-700: #7c3aed;
            --primary-800: #6b21a8;
            --primary-900: #581c87;

            /* Gradients with Light Purple */
            --gradient-primary: linear-gradient(to bottom right, #9333ea, #7c3aed);
            --gradient-secondary: linear-gradient(to bottom right, #a855f7, #ec4899);
            --gradient-ai: linear-gradient(to right, #9333ea, #7c3aed);
        }

        /* Custom Tailwind Classes for Light Purple Theme */
        .bg-purple-gradient {
            background: linear-gradient(to bottom right, #9333ea, #7c3aed);
        }

        .bg-purple-gradient-horizontal {
            background: linear-gradient(to right, #9333ea, #7c3aed);
        }

        .bg-purple-secondary-gradient {
            background: linear-gradient(to bottom right, #a855f7, #ec4899);
        }

        .text-purple-gradient {
            background: linear-gradient(to bottom right, #9333ea, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Chart Colors */
        .chart-purple-1 {
            color: #a855f7;
        }

        .chart-purple-2 {
            color: #9333ea;
        }

        .chart-purple-3 {
            color: #7c3aed;
        }

        .chart-purple-4 {
            color: #c084fc;
        }

        .chart-purple-5 {
            color: #d8b4fe;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a855f7;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        /* Chart area fill gradient */
        .chart-area-gradient {
            background: linear-gradient(to bottom, rgba(168, 85, 247, 0.3), rgba(168, 85, 247, 0));
        }

        body.sidebar-collapsed .sidebar-title,
        body.sidebar-collapsed .sidebar-label {
            display: none;
        }

        body.sidebar-collapsed #appSidebar {
            width: 4rem !important;
        }

        body.sidebar-collapsed #appSidebar>div {
            padding-left: 0 !important;
            padding-right: 0 !important;
        }

        body.sidebar-collapsed #appSidebar .sidebar-item {
            justify-content: center;
            padding-left: 0 !important;
            padding-right: 0 !important;
            padding-top: 0.6rem !important;
            padding-bottom: 0.6rem !important;
            width: 100% !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
            border-radius: 0 !important;
        }

        /* Collapse button icon flip */
        body.sidebar-collapsed #sidebarCollapse i[data-lucide="chevrons-left"] {
            transform: rotate(180deg);
        }

        /* Sidebar width variable */
        #appSidebar {
            width: 14rem;
            transition: width 0.2s ease;
        }

        /* Nav tab active pill */
        .nav-tab.active {
            background: #f3e8ff;
            color: #9333ea;
            font-weight: 600;
        }

        /* Sidebar active item left accent */
        .sidebar-item.sidebar-active {
            border-left: 3px solid #9333ea;
        }

        /* =====================================================
           RESPONSIVE FIXES — Mobile-first overrides
           ===================================================== */

        /* Ensure main content never overflows horizontally */
        #main-content {
            min-width: 0;
            word-break: break-word;
        }

        /* Tables: always scrollable horizontally without breaking words */
        #main-content table {
            min-width: 480px;
        }

        #main-content table th,
        #main-content table td {
            white-space: nowrap;
        }

        #main-content .overflow-x-auto,
        #main-content .-mx-2 {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Cards: clamp padding and font sizes on small screens */
        @media (max-width: 639px) {

            /* Page-level padding already handled by main tag sm:p-6,
               but ensure inner card text doesn't overflow */
            #main-content h2 {
                font-size: 1.15rem;
                line-height: 1.4;
            }

            #main-content h3 {
                font-size: 1rem;
            }

            /* KPI card number — was text-2xl/3xl, keep readable */
            #main-content .text-2xl {
                font-size: 1.25rem;
            }

            #main-content .text-3xl {
                font-size: 1.5rem;
            }

            /* Button groups in section headers wrap */
            #main-content .flex.flex-wrap>button,
            #main-content .flex.flex-wrap>a {
                font-size: 0.75rem;
                padding: 0.35rem 0.75rem;
            }

            /* Nav tabs in header: hide on mobile (hamburger replaces) */
            /* Ensure notification dropdown doesn't overflow */
            #notificationMenu {
                width: calc(100vw - 2rem);
                right: -4rem;
            }

            #globalSearchResults {
                min-width: calc(100vw - 4rem);
            }

            /* Sidebar items when open on mobile */
            #appSidebar .sidebar-item {
                font-size: 0.8rem;
            }

            /* Sales funnel: make bars smaller so they fit */
            /* They're in a grid which now stacks on mobile */
        }

        /* Tablet adjustments */
        @media (min-width: 640px) and (max-width: 1023px) {
            #notificationMenu {
                width: 20rem;
            }
        }

        /* Prevent overflow for media/canvas but NOT grids/flex containers */
        #main-content img,
        #main-content canvas,
        #main-content video {
            max-width: 100%;
            box-sizing: border-box;
        }
        /* Ensure all block elements use border-box sizing */
        #main-content * {
            box-sizing: border-box;
        }

        /* Charts container: shrink gracefully */
        #main-content .h-64 {
            min-height: 10rem;
        }

        @media (max-width: 639px) {
            #main-content .h-64 {
                height: 12rem;
            }

            #main-content .h-32 {
                height: 6rem;
            }
        }

        /* Form inputs inside cards: always full width */
        #main-content input[type="text"],
        #main-content input[type="number"],
        #main-content input[type="email"],
        #main-content input[type="date"],
        #main-content select,
        #main-content textarea {
            max-width: 100%;
            min-width: 0;
        }

        /* Pipeline progress dots: wrap on tiny screens (scoped to small screens only) */
        @media (max-width: 639px) {
            #main-content .flex.items-center.justify-between {
                flex-wrap: wrap;
                gap: 0.25rem;
            }
        }

        /* Section header row (title + action buttons) */
        #main-content .space-y-6>div:first-child.flex,
        #main-content .space-y-4>div:first-child.flex {
            flex-wrap: wrap;
        }

        /* Col-span-2 inside responsive 3-col grids: let it be full on mobile */
        @media (max-width: 767px) {
            [class*="col-span-2"] {
                grid-column: span 1 / span 1;
            }
        }

        @media (min-width: 1024px) {
            [class*="col-span-2"] {
                grid-column: span 2 / span 2;
            }
        }

        /* Notification dropdown z-index fix for mobile */
        #notificationMenu,
        #profileMenu,
        #globalSearchResults {
            z-index: 9999;
        }

        /* Scrollable table wrapper fix ensuring it's touchable */
        .overflow-x-auto {
            -webkit-overflow-scrolling: touch;
        }

        /* ─── CRITICAL: force table elements to use correct display modes ─── */
        /* Global rules (flex-wrap, max-width) must not break table layout     */
        #main-content table {
            display: table !important;
            width: 100%;
        }
        #main-content thead {
            display: table-header-group !important;
        }
        #main-content tbody {
            display: table-row-group !important;
        }
        #main-content tr {
            display: table-row !important;
        }
        #main-content th,
        #main-content td {
            display: table-cell !important;
            vertical-align: middle;
        }
        /* Filter inputs/selects inside table cells: constrain to cell width */
        #main-content th select,
        #main-content td select,
        #main-content th input,
        #main-content td input {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            display: block;
        }


        /* Badge / chip text shouldn't shrink too much */
        .px-2.py-1.rounded-full,
        .px-3.py-1.rounded-full,
        .px-2.py-1.rounded-md {
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Modal form 2-col grid — inline style sets 1fr; this overrides at sm+ */
        @media (min-width: 640px) {
            .sm-grid-2col {
                grid-template-columns: 1fr 1fr !important;
            }
        }

        /* Utility: break long words (currency values, names) */
        .break-words {
            overflow-wrap: break-word;
            word-break: break-word;
        }
    </style>
</head>

<body class="bg-slate-50 font-sans antialiased h-screen overflow-hidden flex flex-col">
    <!-- Header -->
    <header id="mainHeader" class="flex-none sticky top-0 z-50 bg-white border-b border-slate-200">
        <div class="flex flex-wrap md:flex-nowrap items-center min-h-[3.5rem] gap-0">

            <!-- Collapse / Hamburger — fixed width matching sidebar -->
            <div class="flex items-center justify-center flex-shrink-0 h-14 border-r border-slate-100"
                style="width:4rem;">
                <!-- Mobile hamburger -->
                <button id="sidebarToggle"
                    class="md:hidden p-2 text-slate-500 hover:text-purple-600 hover:bg-slate-100 rounded-lg transition-colors"
                    aria-label="Toggle navigation">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <!-- Desktop collapse -->
                <button id="sidebarCollapse"
                    class="hidden md:flex items-center justify-center p-2 text-slate-500 hover:text-purple-600 hover:bg-slate-100 rounded-lg transition-colors"
                    aria-label="Collapse sidebar">
                    <i data-lucide="chevrons-left" class="w-5 h-5 transition-transform duration-200"></i>
                </button>
            </div>

            <!-- Top Navigation (drops to new line on mobile) -->
            <nav
                class="order-3 md:order-none w-full md:w-auto md:flex-1 flex items-center gap-1 overflow-x-auto px-3 py-2 md:py-0 border-t border-slate-100 md:border-none bg-slate-50 md:bg-white hide-scrollbar">
                <button
                    class="nav-tab active shrink-0 whitespace-nowrap px-3 py-1.5 text-sm font-medium rounded-md transition-colors"
                    data-section="dashboard">Dashboard</button>
                <button
                    class="nav-tab shrink-0 whitespace-nowrap px-3 py-1.5 text-sm font-medium rounded-md transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                    data-section="leads">Leads &amp; Clients</button>
                <button
                    class="nav-tab shrink-0 whitespace-nowrap px-3 py-1.5 text-sm font-medium rounded-md transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                    data-section="projects">Projects &amp; Pipeline</button>
                <button
                    class="nav-tab shrink-0 whitespace-nowrap px-3 py-1.5 text-sm font-medium rounded-md transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                    data-section="campaigns">Campaigns</button>
                <button
                    class="nav-tab shrink-0 whitespace-nowrap px-3 py-1.5 text-sm font-medium rounded-md transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                    data-section="billing">Billing</button>
                <button
                    class="nav-tab shrink-0 whitespace-nowrap px-3 py-1.5 text-sm font-medium rounded-md transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                    data-section="engagement">Engagement</button>
                <button
                    class="nav-tab shrink-0 whitespace-nowrap px-3 py-1.5 text-sm font-medium rounded-md transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                    data-section="reports">Reports</button>

            </nav>

            <!-- Right Side Actions -->
            <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0 pr-4 h-14 ml-auto">
                <!-- Search -->
                <div class="relative">
                    <i data-lucide="search"
                        class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400"></i>
                    <input id="globalSearch" type="text" placeholder="Search..."
                        class="pl-8 pr-3 py-1.5 w-36 sm:w-48 md:w-52 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent bg-slate-50 focus:bg-white transition-colors">
                    <div id="globalSearchResults"
                        class="hidden absolute top-full left-0 right-0 mt-2 min-w-72 max-h-80 overflow-y-auto bg-white border border-slate-200 rounded-xl shadow-xl z-[9999]">
                    </div>
                </div>

                <!-- Notifications -->
                <div class="relative">
                    <button id="notificationToggle"
                        class="relative p-2 text-slate-500 hover:text-purple-600 hover:bg-slate-100 rounded-lg transition-colors"
                        aria-label="Open notifications">
                        <i data-lucide="bell" class="w-4.5 h-4.5"></i>
                        <span id="notificationCount"
                            class="absolute -top-0.5 -right-0.5 min-w-4 h-4 px-1 bg-red-500 text-white text-[9px] leading-4 text-center rounded-full">3</span>
                    </button>
                    <div id="notificationMenu"
                        class="hidden absolute right-0 mt-2 w-80 bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden">
                        <div class="p-4 border-b border-slate-200 flex items-center justify-between">
                            <div>
                                <div class="text-sm font-semibold text-slate-900">Notifications</div>
                                <div id="notificationSubtitle" class="text-xs text-slate-500">You have 3 unread</div>
                            </div>
                            <button id="markAllReadBtn"
                                class="px-3 py-1.5 text-xs font-medium bg-purple-50 text-purple-700 rounded-lg hover:bg-purple-100 transition-colors">Mark
                                all read</button>
                        </div>
                        <div id="notificationList" class="max-h-96 overflow-y-auto"></div>
                        <div class="p-3 border-t border-slate-200">
                            <button id="viewAllNotificationsBtn"
                                class="w-full px-4 py-2 text-sm font-medium bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors">View
                                all</button>
                        </div>
                    </div>
                </div>

                <!-- User Profile -->
                <div class="relative">
                    <button id="profileToggle"
                        class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center text-white text-xs font-bold ring-2 ring-white hover:ring-purple-300 transition"
                        aria-label="Open profile menu">

                    </button>
                    <div id="profileMenu"
                        class="hidden absolute right-0 mt-2 w-56 bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden">
                        <div class="p-4 border-b border-slate-200">
                            <div id="profileName" class="text-sm font-semibold text-slate-900"></div>
                            <div id="profileRole" class="text-xs text-slate-500">Administrator</div>
                        </div>
                        <div class="p-2">
                            <button id="logoutBtn"
                                class="w-full text-left px-3 py-2 text-sm font-medium rounded-lg hover:bg-slate-50 text-slate-700 flex items-center gap-2">
                                <i data-lucide="log-out" class="w-4 h-4 text-slate-500"></i>
                                Logout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex flex-1 min-h-0 relative overflow-hidden">
        <div id="sidebarOverlay" class="hidden absolute inset-0 bg-slate-900/40 z-40 md:hidden"></div>

        <!-- Sidebar -->
        <aside id="appSidebar"
            class="absolute md:relative z-50 md:z-auto top-0 left-0 h-full bg-white border-r border-slate-200 flex-shrink-0 overflow-y-auto overflow-x-hidden transform -translate-x-full md:translate-x-0 transition-all duration-200">
            <div class="p-3">
                <!-- Sidebar Navigation will be dynamically inserted here -->
                <div id="sidebar-nav"></div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 sm:p-6 overflow-y-auto min-w-0">
            <div id="main-content" class="w-full">
                <!-- Content will be dynamically inserted here -->
            </div>
        </main>
    </div>

    <script>
        // Auth guard — must have JWT token to view this page
        (function () {
            if (!localStorage.getItem('bezent_jwt')) {
                location.replace('index.html');
            }
            // Expose BezentAuth globally for app.js to use
            var TK = 'bezent_jwt';
            window.BezentAuth = {
                getToken: function () { return localStorage.getItem(TK) || ''; },
                setToken: function (t) { localStorage.setItem(TK, t); },
                clearToken: function () { localStorage.removeItem(TK); localStorage.removeItem('bezent_user'); },
                isLoggedIn: function () { return Boolean(localStorage.getItem(TK)); }
            };
            window.apiFetch = function (p, o) {
                o = o || {};
                var hdr = { 'Content-Type': 'application/json' };
                var tok = window.BezentAuth.getToken();
                if (tok) hdr['Authorization'] = 'Bearer ' + tok;
                if (o.headers) Object.assign(hdr, o.headers);
                return fetch('/api' + p, Object.assign({}, o, { headers: hdr }))
                    .then(function (r) {
                        if (r.status === 401) { window.BezentAuth.clearToken(); location.replace('index.html'); return null; }
                        return r.json().catch(function () { return {}; });
                    });
            };
        })();
    </script>
    <script type="module" src="/app.js"></script>
</body>

</html>
