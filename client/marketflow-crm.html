<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Light Purple Theme System */
        :root {
            /* Primary Light Purple Palette */
            --purple-50: #faf5ff;
            --purple-100: #f3e8ff;
            --purple-200: #e9d5ff;
            --purple-300: #d8b4fe;
            --purple-400: #c084fc;
            --purple-500: #a855f7;
            --purple-600: #9333ea;
            --purple-700: #7c3aed;
            --purple-800: #6b21a8;
            --purple-900: #581c87;

            /* Replacing Blue with Light Purple */
            --primary-50: #faf5ff;
            --primary-100: #f3e8ff;
            --primary-200: #e9d5ff;
            --primary-300: #d8b4fe;
            --primary-400: #c084fc;
            --primary-500: #a855f7;
            --primary-600: #9333ea;
            --primary-700: #7c3aed;
            --primary-800: #6b21a8;
            --primary-900: #581c87;

            /* Gradients with Light Purple */
            --gradient-primary: linear-gradient(to bottom right, #9333ea, #7c3aed);
            --gradient-secondary: linear-gradient(to bottom right, #a855f7, #ec4899);
            --gradient-ai: linear-gradient(to right, #9333ea, #7c3aed);
        }

        /* Custom Tailwind Classes for Light Purple Theme */
        .bg-purple-gradient {
            background: linear-gradient(to bottom right, #9333ea, #7c3aed);
        }

        .bg-purple-gradient-horizontal {
            background: linear-gradient(to right, #9333ea, #7c3aed);
        }

        .bg-purple-secondary-gradient {
            background: linear-gradient(to bottom right, #a855f7, #ec4899);
        }

        .text-purple-gradient {
            background: linear-gradient(to bottom right, #9333ea, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Chart Colors */
        .chart-purple-1 {
            color: #a855f7;
        }

        .chart-purple-2 {
            color: #9333ea;
        }

        .chart-purple-3 {
            color: #7c3aed;
        }

        .chart-purple-4 {
            color: #c084fc;
        }

        .chart-purple-5 {
            color: #d8b4fe;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a855f7;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        /* Chart area fill gradient */
        .chart-area-gradient {
            background: linear-gradient(to bottom, rgba(168, 85, 247, 0.3), rgba(168, 85, 247, 0));
        }

        body.sidebar-collapsed .sidebar-title,
        body.sidebar-collapsed .sidebar-label {
            display: none;
        }

        body.sidebar-collapsed #appSidebar,
        body.sidebar-collapsed #appSidebar>div {
            width: 5rem !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }

        body.sidebar-collapsed #appSidebar .sidebar-item {
            justify-content: center;
            padding-left: 0 !important;
            padding-right: 0 !important;
            padding-top: 1rem !important;
            padding-bottom: 1rem !important;
            width: 100% !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
        }

        body.sidebar-collapsed #appSidebar .sidebar-item i {
            width: 4rem !important;
            height: 4rem !important;
        }

        body.sidebar-collapsed #appSidebar .sidebar-item svg {
            stroke-width: 2.5;
        }
    </style>
</head>

<body class="bg-slate-50 font-sans antialiased min-h-screen">
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white border-b border-slate-200 h-16">
        <div class="flex items-center justify-between h-full px-4 sm:px-6 gap-3">
            <!-- Logo -->
            <div class="flex items-center gap-2 flex-shrink-0">
                <button id="sidebarToggle"
                    class="md:hidden p-2 -ml-2 text-slate-600 hover:text-purple-600 hover:bg-slate-100 rounded-lg transition-colors"
                    aria-label="Toggle navigation">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <button id="sidebarCollapse"
                    class="hidden md:inline-flex p-2 text-slate-600 hover:text-purple-600 hover:bg-slate-100 rounded-lg transition-colors"
                    aria-label="Collapse sidebar">
                    <i data-lucide="chevrons-left" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Top Navigation -->
            <nav class="hidden md:flex flex-1 items-center gap-1 overflow-x-auto ml-4 lg:ml-8">
                <button
                    class="nav-tab active px-4 py-2 text-sm font-medium rounded-md transition-colors bg-purple-50 text-purple-700"
                    data-section="dashboard">Dashboard</button>
                <button
                    class="nav-tab px-4 py-2 text-sm font-medium rounded-md transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                    data-section="leads">Leads & Clients</button>
                <button
                    class="nav-tab px-4 py-2 text-sm font-medium rounded-md transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                    data-section="projects">Projects & Pipeline</button>
                <button
                    class="nav-tab px-4 py-2 text-sm font-medium rounded-md transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                    data-section="campaigns">Campaigns</button>
                <button
                    class="nav-tab px-4 py-2 text-sm font-medium rounded-md transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                    data-section="billing">Billing</button>
                <button
                    class="nav-tab px-4 py-2 text-sm font-medium rounded-md transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                    data-section="engagement">Engagement</button>
                <button
                    class="nav-tab px-4 py-2 text-sm font-medium rounded-md transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                    data-section="reports">Reports</button>
                <button
                    class="nav-tab px-4 py-2 text-sm font-medium rounded-md transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                    data-section="ai">AI & Automation</button>
            </nav>

            <!-- Right Side Actions -->
            <div class="flex items-center gap-2 sm:gap-4 flex-shrink-0">
                <!-- Search -->
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input id="globalSearch" type="text" placeholder="Search..."
                        class="pl-10 pr-4 py-2 w-40 sm:w-56 md:w-60 lg:w-64 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    <div id="globalSearchResults"
                        class="hidden absolute top-full left-0 right-0 mt-2 min-w-72 max-h-80 overflow-y-auto bg-white border border-slate-200 rounded-xl shadow-xl z-[9999]">
                    </div>
                </div>

                <!-- Notifications -->
                <div class="relative">
                    <button id="notificationToggle"
                        class="relative p-2 text-slate-600 hover:text-purple-600 hover:bg-slate-100 rounded-lg transition-colors"
                        aria-label="Open notifications">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                        <span id="notificationCount"
                            class="absolute -top-1 -right-1 min-w-5 h-5 px-1 bg-red-500 text-white text-[10px] leading-5 text-center rounded-full">3</span>
                    </button>
                    <div id="notificationMenu"
                        class="hidden absolute right-0 mt-2 w-80 bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden">
                        <div class="p-4 border-b border-slate-200 flex items-center justify-between">
                            <div>
                                <div class="text-sm font-semibold text-slate-900">Notifications</div>
                                <div id="notificationSubtitle" class="text-xs text-slate-500">You have 3 unread</div>
                            </div>
                            <button id="markAllReadBtn"
                                class="px-3 py-2 text-xs font-medium bg-purple-50 text-purple-700 rounded-lg hover:bg-purple-100 transition-colors">Mark
                                all read</button>
                        </div>
                        <div id="notificationList" class="max-h-96 overflow-y-auto"></div>
                        <div class="p-3 border-t border-slate-200">
                            <button id="viewAllNotificationsBtn"
                                class="w-full px-4 py-2 text-sm font-medium bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors">View
                                all</button>
                        </div>
                    </div>
                </div>

                <!-- User Profile -->
                <div class="relative">
                    <button id="profileToggle"
                        class="w-9 h-9 bg-purple-600 rounded-full flex items-center justify-center text-white text-sm font-semibold ring-1 ring-slate-200 hover:ring-purple-300 transition"
                        aria-label="Open profile menu">
                        SK
                    </button>
                    <div id="profileMenu"
                        class="hidden absolute right-0 mt-2 w-64 bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden">
                        <div class="p-4 border-b border-slate-200">
                            <div id="profileName" class="text-sm font-semibold text-slate-900">Sarah Kumar</div>
                            <div id="profileRole" class="text-xs text-slate-500">Administrator</div>
                        </div>
                        <div class="p-2">
                            <button id="logoutBtn"
                                class="w-full text-left px-3 py-2 text-sm font-medium rounded-lg hover:bg-slate-50 text-slate-700 flex items-center gap-2">
                                <i data-lucide="log-out" class="w-4 h-4 text-slate-500"></i>
                                Logout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex h-[calc(100vh-4rem)]">
        <div id="sidebarOverlay" class="hidden fixed inset-0 top-16 bg-slate-900/30 z-40 md:hidden"></div>
        <!-- Sidebar -->
        <aside id="appSidebar"
            class="fixed md:static z-50 md:z-auto top-16 left-0 h-[calc(100vh-4rem)] w-72 sm:w-80 md:w-56 bg-white border-r border-slate-200 flex-shrink-0 overflow-y-auto transform -translate-x-full md:translate-x-0 transition-transform duration-200">
            <div class="p-4">
                <div class="md:hidden mb-4">
                    <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Main Sections</div>
                    <div class="mt-3 grid grid-cols-2 gap-2">
                        <button
                            class="nav-tab active px-3 py-2 text-xs font-medium rounded-lg transition-colors bg-purple-50 text-purple-700"
                            data-section="dashboard">Dashboard</button>
                        <button
                            class="nav-tab px-3 py-2 text-xs font-medium rounded-lg transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                            data-section="leads">Leads</button>
                        <button
                            class="nav-tab px-3 py-2 text-xs font-medium rounded-lg transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                            data-section="projects">Projects</button>
                        <button
                            class="nav-tab px-3 py-2 text-xs font-medium rounded-lg transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                            data-section="campaigns">Campaigns</button>
                        <button
                            class="nav-tab px-3 py-2 text-xs font-medium rounded-lg transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                            data-section="billing">Billing</button>
                        <button
                            class="nav-tab px-3 py-2 text-xs font-medium rounded-lg transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                            data-section="engagement">Engagement</button>
                        <button
                            class="nav-tab px-3 py-2 text-xs font-medium rounded-lg transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                            data-section="reports">Reports</button>
                        <button
                            class="nav-tab px-3 py-2 text-xs font-medium rounded-lg transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                            data-section="ai">AI</button>
                    </div>
                    <div class="mt-4 border-t border-slate-200"></div>
                </div>
                <!-- Sidebar Navigation will be dynamically inserted here -->
                <div id="sidebar-nav"></div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 sm:p-6 overflow-y-auto">
            <div id="main-content">
                <!-- Content will be dynamically inserted here -->
            </div>
        </main>
    </div>

    <script src="app.js?v=141"></script>
</body>

</html>
